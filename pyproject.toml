[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img2svg"
version = "3.0.0"
description = "High-Fidelity AI Image to SVG Converter & Vector Reconstruction Engine (Raster to Pure SVG, LaTeX TikZ, and Matplotlib)."
readme = "README.md"
authors = [
    { name = "Tawhid & Contributors", email = "tawhid@example.com" }
]
license = { text = "MIT" }
keywords = [
    "image-to-svg",
    "png-to-svg",
    "jpg-to-svg",
    "raster-to-vector",
    "vectorizer",
    "image-to-vector",
    "svg-converter",
    "diagram-to-svg",
    "math-to-svg",
    "scientific-image-to-svg",
    "latex-tikz",
    "computer-vision",
    "ransac-fitting",
    "vector-graphics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.22.0",
    "opencv-python>=4.6.0",
    "matplotlib>=3.5.0",
    "scipy>=1.8.0",
    "sympy>=1.10.0"
]

[project.scripts]
img2svg = "acad_visual.cli.main:main"
image-to-svg = "acad_visual.cli.main:main"
acad_visual = "acad_visual.cli.main:main"

[project.urls]
"Homepage" = "https://github.com/tawhid120/image-to-svg"
"Bug Tracker" = "https://github.com/tawhid120/image-to-svg/issues"
"Documentation" = "https://github.com/tawhid120/image-to-svg#readme"
